<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Puzle 4 · CubeSat de GranaSAT con los paneles solares desplegados y la antena (ilustración propia). -->
  <defs>
    <linearGradient id="orbita" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05102b"/><stop offset="1" stop-color="#16407a"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#orbita)"/>
  <g fill="#fff">
    <circle cx="120" cy="20" r="2"/><circle cx="200" cy="30" r="2.2"/><circle cx="20" cy="110" r="1.8"/><circle cx="285" cy="100" r="2"/>
    <circle cx="30" cy="200" r="2"/><circle cx="280" cy="195" r="2"/><circle cx="100" cy="90" r="1.6"/><circle cx="215" cy="195" r="1.8"/>
  </g>
  <path d="M250,100 l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4z" fill="#fff59d"/>
  <!-- Sol (arriba a la izquierda) -->
  <g stroke="#ffca28" stroke-width="5" stroke-linecap="round">
    <path d="M44,8 V18 M44,78 V88 M4,48 H14 M74,48 H84 M16,20 L23,27 M65,69 L72,76 M16,76 L23,69 M65,27 L72,20"/>
  </g>
  <circle cx="44" cy="48" r="22" fill="#ffeb3b" stroke="#05102b" stroke-width="3"/>
  <!-- Ondas de radio desde la antena (arriba a la derecha) -->
  <g fill="none" stroke="#5ee6d0" stroke-width="5" stroke-linecap="round">
    <path d="M214,40 q14,14 0,28"/><path d="M232,26 q26,28 0,56"/><path d="M250,12 q38,42 0,84"/>
  </g>
  <!-- La Tierra asomando por abajo -->
  <circle cx="150" cy="520" r="290" fill="#1e88e5" stroke="#05102b" stroke-width="4"/>
  <path d="M30,262 q40,-22 80,-6 q-10,26 -45,30 q-25,-4 -35,-24Z M180,240 q45,-10 80,12 q-15,22 -50,20 q-25,-10 -30,-32Z" fill="#43a047" stroke="#05102b" stroke-width="3"/>
  <path d="M120,268 q30,-8 55,2 M240,282 q20,-6 40,0" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85"/>
  <circle cx="150" cy="520" r="296" fill="none" stroke="#81d4fa" stroke-width="4" opacity=".7"/>
  <!-- Antenas -->
  <path d="M150,104 V42" stroke="#eceff1" stroke-width="5"/>
  <circle cx="150" cy="38" r="8" fill="#ef5350" stroke="#05102b" stroke-width="3"/>
  <path d="M172,106 L204,60" stroke="#eceff1" stroke-width="4"/>
  <circle cx="206" cy="56" r="5" fill="#eceff1" stroke="#05102b" stroke-width="2"/>
  <!-- Paneles solares -->
  <g stroke="#05102b" stroke-width="3">
    <rect x="12" y="116" width="92" height="48" fill="#1565c0"/>
    <rect x="196" y="116" width="92" height="48" fill="#1565c0"/>
  </g>
  <g stroke="#90caf9" stroke-width="2">
    <path d="M35,116 V164 M58,116 V164 M81,116 V164 M12,140 H104"/>
    <path d="M219,116 V164 M242,116 V164 M265,116 V164 M196,140 H288"/>
  </g>
  <path d="M104,140 H116 M184,140 H196" stroke="#b0bec5" stroke-width="6"/>
  <!-- Cuerpo del CubeSat -->
  <rect x="114" y="102" width="72" height="76" rx="6" fill="url(#oro)" stroke="#05102b" stroke-width="4"/>
  <rect x="124" y="112" width="52" height="26" rx="3" fill="#263238" stroke="#05102b" stroke-width="2.5"/>
  <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10.5" fill="#ffb627">GranaSAT</text>
  <circle cx="134" cy="158" r="7" fill="#29b6f6" stroke="#05102b" stroke-width="2.5"/>
  <rect x="148" y="150" width="28" height="7" fill="#ef5350" stroke="#05102b" stroke-width="2"/>
  <rect x="148" y="161" width="28" height="7" fill="#66bb6a" stroke="#05102b" stroke-width="2"/>
  <path d="M114,178 v10 M186,178 v10" stroke="#78909c" stroke-width="6"/>
</svg>
