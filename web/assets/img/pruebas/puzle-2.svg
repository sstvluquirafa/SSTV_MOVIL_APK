<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Puzle 2 · Astronauta saludando con la Tierra detrás (ilustración propia, GranaSAT). -->
  <defs>
    <linearGradient id="espacio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1440"/><stop offset="1" stop-color="#2a5bb8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#espacio)"/>
  <g fill="#fff">
    <circle cx="15" cy="120" r="2"/><circle cx="90" cy="18" r="2.2"/><circle cx="170" cy="30" r="1.8"/><circle cx="290" cy="18" r="2"/>
    <circle cx="20" cy="200" r="2"/><circle cx="285" cy="95" r="2.2"/><circle cx="70" cy="290" r="1.8"/><circle cx="160" cy="150" r="1.6"/>
  </g>
  <path d="M265,140 l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4z" fill="#fff59d"/>
  <path d="M28,160 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3z" fill="#fff59d"/>
  <!-- Luna pequeña (arriba a la izquierda) -->
  <circle cx="42" cy="44" r="24" fill="#cfd8dc" stroke="#0b1230" stroke-width="3"/>
  <circle cx="34" cy="38" r="6" fill="#90a4ae"/><circle cx="50" cy="54" r="4" fill="#90a4ae"/>
  <!-- Tierra (abajo a la derecha) -->
  <circle cx="225" cy="232" r="98" fill="#1e88e5" stroke="#0b1230" stroke-width="4"/>
  <path d="M160,190 q20,-30 50,-20 q15,25 -5,40 q-20,10 -30,30 q-25,-15 -15,-50Z" fill="#43a047" stroke="#0b1230" stroke-width="3"/>
  <path d="M240,160 q30,-5 45,20 q-5,25 -30,25 q-25,-15 -15,-45Z" fill="#66bb6a" stroke="#0b1230" stroke-width="3"/>
  <path d="M215,260 q25,-10 40,10 q-10,25 -35,22 q-15,-15 -5,-32Z" fill="#43a047" stroke="#0b1230" stroke-width="3"/>
  <path d="M150,248 q30,-8 50,4 M190,150 q25,-6 45,2 M250,225 q20,-5 35,5" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85"/>
  <!-- Astronauta -->
  <rect x="60" y="138" width="22" height="64" rx="8" fill="#90a4ae" stroke="#0b1230" stroke-width="3"/>
  <!-- brazo saludando (derecha, hacia arriba) -->
  <path d="M150,150 Q182,128 196,82" stroke="#0b1230" stroke-width="25" stroke-linecap="round" fill="none"/>
  <path d="M150,150 Q182,128 196,82" stroke="#fafafa" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="198" cy="72" r="15" fill="#ff7043" stroke="#0b1230" stroke-width="3"/>
  <path d="M220,52 q10,12 4,28 M232,44 q14,18 6,40" stroke="#fff59d" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- brazo izquierdo (abajo) -->
  <path d="M84,152 Q62,180 66,214" stroke="#0b1230" stroke-width="25" stroke-linecap="round" fill="none"/>
  <path d="M84,152 Q62,180 66,214" stroke="#fafafa" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="67" cy="222" r="13" fill="#ff7043" stroke="#0b1230" stroke-width="3"/>
  <!-- piernas -->
  <path d="M100,212 V262 M136,212 V262" stroke="#0b1230" stroke-width="28" stroke-linecap="round"/>
  <path d="M100,212 V262 M136,212 V262" stroke="#fafafa" stroke-width="21" stroke-linecap="round"/>
  <rect x="84" y="262" width="32" height="20" rx="7" fill="#546e7a" stroke="#0b1230" stroke-width="3"/>
  <rect x="122" y="262" width="32" height="20" rx="7" fill="#546e7a" stroke="#0b1230" stroke-width="3"/>
  <!-- cuerpo -->
  <rect x="80" y="134" width="76" height="86" rx="18" fill="#fafafa" stroke="#0b1230" stroke-width="4"/>
  <rect x="96" y="156" width="44" height="30" rx="5" fill="#37474f" stroke="#0b1230" stroke-width="3"/>
  <circle cx="108" cy="171" r="5" fill="#ef5350"/><circle cx="122" cy="171" r="5" fill="#66bb6a"/><rect x="129" y="165" width="7" height="12" fill="#29b6f6"/>
  <rect x="88" y="196" width="18" height="12" fill="#ff7043" stroke="#0b1230" stroke-width="2"/>
  <!-- casco -->
  <circle cx="118" cy="96" r="44" fill="#fafafa" stroke="#0b1230" stroke-width="4"/>
  <ellipse cx="122" cy="98" rx="30" ry="24" fill="url(#visor)" stroke="#0b1230" stroke-width="4"/>
  <path d="M104,88 q8,-10 22,-10" stroke="#fffde7" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="72" y="88" width="9" height="20" rx="3" fill="#90a4ae" stroke="#0b1230" stroke-width="2.5"/>
</svg>
