<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Puzle 1 · Cohete despegando (ilustración propia, GranaSAT). Cielo con degradado vertical: cada pieza sabe dónde es «arriba». -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14205e"/><stop offset=".55" stop-color="#5a2f8f"/><stop offset="1" stop-color="#ff8f5a"/>
    </linearGradient>
    <linearGradient id="llama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59d"/><stop offset=".5" stop-color="#ffb300"/><stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#cielo)"/>
  <g fill="#fff">
    <circle cx="20" cy="18" r="2"/><circle cx="105" cy="22" r="2.4"/><circle cx="190" cy="16" r="2"/><circle cx="285" cy="110" r="2"/>
    <circle cx="20" cy="95" r="2.2"/><circle cx="96" cy="70" r="1.8"/><circle cx="200" cy="85" r="2"/><circle cx="270" cy="20" r="2"/>
  </g>
  <path d="M135,30 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4z" fill="#fff59d"/>
  <path d="M235,180 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3z" fill="#fff59d"/>
  <!-- Luna creciente (arriba a la izquierda) -->
  <path d="M58,18 A34 34 0 1 0 84,74 A26 26 0 1 1 58,18Z" fill="#ffd54f" stroke="#1b1446" stroke-width="3"/>
  <!-- Planeta con anillo (arriba a la derecha) -->
  <ellipse cx="250" cy="58" rx="40" ry="10" fill="none" stroke="#80deea" stroke-width="5" transform="rotate(-18 250 58)"/>
  <circle cx="250" cy="58" r="22" fill="#ba68c8" stroke="#1b1446" stroke-width="3"/>
  <path d="M232,52 q18,-8 36,4" stroke="#8e24aa" stroke-width="5" fill="none"/>
  <!-- Cometa (izquierda, en medio) -->
  <path d="M8,118 L58,142 L52,152 Z" fill="#80deea" opacity=".85"/>
  <circle cx="58" cy="148" r="11" fill="#e0f7fa" stroke="#1b1446" stroke-width="3"/>
  <!-- Torre de lanzamiento (derecha) -->
  <g stroke="#c62828" stroke-width="5" fill="none">
    <path d="M232,105 V262 M262,105 V262 M232,130 L262,155 M262,130 L232,155 M232,180 L262,205 M262,180 L232,205 M232,230 L262,255"/>
    <path d="M232,140 H190"/>
  </g>
  <rect x="226" y="96" width="42" height="12" rx="3" fill="#ef5350" stroke="#1b1446" stroke-width="3"/>
  <!-- Suelo con colinas -->
  <path d="M0,262 Q50,240 100,258 T200,256 T300,252 V300 H0Z" fill="#43a047" stroke="#1b1446" stroke-width="3"/>
  <!-- Humo -->
  <g fill="#eceff1" stroke="#1b1446" stroke-width="3">
    <circle cx="40" cy="268" r="24"/><circle cx="78" cy="252" r="22"/><circle cx="102" cy="276" r="20"/>
    <circle cx="200" cy="276" r="21"/><circle cx="226" cy="256" r="19"/><circle cx="262" cy="276" r="25"/>
  </g>
  <!-- Llamas -->
  <path d="M126,206 Q118,240 150,282 Q182,240 174,206Z" fill="url(#llama)" stroke="#1b1446" stroke-width="3"/>
  <path d="M138,206 Q134,232 150,256 Q166,232 162,206Z" fill="#fffde7"/>
  <!-- Cohete -->
  <path d="M120,170 L92,212 L120,204Z M180,170 L208,212 L180,204Z" fill="#e53935" stroke="#1b1446" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M150,32 C178,58 184,120 180,206 H120 C116,120 122,58 150,32Z" fill="#f5f5f5" stroke="#1b1446" stroke-width="4"/>
  <path d="M150,32 C162,43 170,58 175,76 H125 C130,58 138,43 150,32Z" fill="#e53935" stroke="#1b1446" stroke-width="3.5"/>
  <circle cx="150" cy="112" r="17" fill="#4fc3f7" stroke="#1b1446" stroke-width="4"/>
  <circle cx="144" cy="106" r="5" fill="#e1f5fe"/>
  <rect x="122" y="150" width="56" height="12" fill="#1e88e5" stroke="#1b1446" stroke-width="3"/>
  <path d="M150,170 V206" stroke="#1b1446" stroke-width="3.5"/>
  <rect x="118" y="200" width="64" height="10" rx="3" fill="#78909c" stroke="#1b1446" stroke-width="3"/>
</svg>
